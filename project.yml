name: ScreenCast
options:
  bundleIdPrefix: com.polatmsmakm
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.19.0
targets:
  ScreenCast:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polatmsmakm.screencast
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.polatmsmakm.screencast
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: بث
        CFBundleShortVersionString: "2.0"
        NSMicrophoneUsageDescription: نحتاج المايك عشان تتكلم مع أصدقائك في المكالمة
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: LiveKit
        product: LiveKit
      - target: BroadcastExt
  BroadcastExt:
    type: app-extension
    platform: iOS
    sources:
      - BroadcastExt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polatmsmakm.screencast.broadcast
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: Config/Ext.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.polatmsmakm.screencast
    info:
      path: Config/Ext-Info.plist
      properties:
        CFBundleDisplayName: بث الشاشة
        CFBundleShortVersionString: "2.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    dependencies:
      - package: LiveKit
        product: LiveKit
        embed: false
schemes:
  ScreenCast:
    build:
      targets:
        ScreenCast: all
        BroadcastExt: all
    run:
      config: Debug
    archive:
      config: Release
