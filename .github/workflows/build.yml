name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ScreenCast.xcodeproj -scheme ScreenCast

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ScreenCast.xcodeproj \
            -scheme ScreenCast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | tail -n 80

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ScreenCast.app Payload/
          ls Payload/ScreenCast.app/PlugIns || true
          zip -qry ScreenCast.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-ipa
          path: ScreenCast.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
