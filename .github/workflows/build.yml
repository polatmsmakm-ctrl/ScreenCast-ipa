name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ScreenCast.xcodeproj -scheme ScreenCast

      - name: Inspect SDK headers
        run: |
          R="$HOME/Library/Developer/Xcode/DerivedData"
          E=$(find $R -name TXReplayKitExt.h | head -1)
          echo "### EXT"; sed -n 28,100p "$E"
          T=$(find $R -path "*ios-arm64_armv7*" -name TRTCCloud.h | head -1)
          echo "### SYSAUDIO"; sed -n 950,980p "$T"
          D=$(dirname "$T")
          echo "### ROUTE"; grep -n -B1 -A6 "TRTCAudioRoute" "$D/TRTCCloudDef.h" | head -30
          echo "### VOLPARAM"; grep -n -A12 "interface TRTCAudioVolumeEvaluateParams" "$D/TRTCCloudDef.h"
          echo "### VOLCB"; grep -n -B1 -A1 "onUserVoiceVolume" "$D/TRTCCloudDelegate.h"
          echo "### SCREEN"; grep -n -E "startScreenCapture|stopScreenCapture" "$T"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ScreenCast.xcodeproj \
            -scheme ScreenCast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | tail -n 80

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ScreenCast.app Payload/
          ls Payload/ScreenCast.app/PlugIns || true
          zip -qry ScreenCast.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-ipa
          path: ScreenCast.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
