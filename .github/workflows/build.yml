name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ScreenCast.xcodeproj -scheme ScreenCast

      - name: Inspect SDK headers
        if: always()
        run: |
          for f in $(find "$PWD" "$HOME/Library/Developer/Xcode/DerivedData" -name "TRTCCloudDef.h" -o -name "TXReplayKitExt.h" -o -name "TRTCCloud.h" -o -name "TRTCCloud+*.h" 2>/dev/null | sort -u); do echo "=== $f"; done
          R="$PWD $HOME/Library/Developer/Xcode/DerivedData"
          H=$(find $R -name "TRTCCloudDef.h" 2>/dev/null | head -1)
          D=$(dirname "$H")
          echo "### resolution enum"; grep -n "TRTCVideoResolution_" "$H" | head -60
          echo "### replaykit ext"; cat "$(find $R -name TXReplayKitExt.h 2>/dev/null | head -1)" | grep -n -E "^-|^\+|@property|typedef|NS_ENUM|TXReplayKitExtReason" 
          echo "### audio/volume/route"; grep -rn -E "enableAudioVolumeEvaluation|onUserVoiceVolume|setAudioRoute|muteRemoteAudio|muteAllRemoteAudio|startScreenCaptureByReplaykit|sendAudio|SystemAudio|setSystemVolumeType|startSystemAudio" "$D" | head -40

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ScreenCast.xcodeproj \
            -scheme ScreenCast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | tail -n 80

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ScreenCast.app Payload/
          ls Payload/ScreenCast.app/PlugIns || true
          zip -qry ScreenCast.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenCast-ipa
          path: ScreenCast.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
